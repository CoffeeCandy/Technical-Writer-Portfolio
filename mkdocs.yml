site_name: Evelyn
nav:
  - 主页: index.md
  - 作品:
    - MkDocs用户指南:
      - 概览: portfolio/mkdocs/introduce.md 
      - 快速开始: portfolio/mkdocs/quich-start.md
      - 核心概念: portfolio/mkdocs/concepts.md
      - 操作指南: portfolio/mkdocs/how-to-guide.md
      - 高级用法: portfolio/mkdocs/advance-usage.md
      - 常见问题与故障排查: portfolio/mkdocs/troubleshooting.md
    - material主题用户指南: portfolio/material/introduce.md 
  - 博客说明:
    - 格式规定: about/rules.md
    - 常用git命令: about/git-command.md
theme:
  name: material
 
plugins:
  - search
  - include-markdown

extra_css:
  - css/extra.css
  
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

 
 
